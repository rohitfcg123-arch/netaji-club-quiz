name: Build Netaji Club Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-app assembleDebug

      - name: Write APK signing fingerprint
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > android-app/debug-signing-certificate.txt
          else
            echo "apksigner was not found; inspect the APK signing certificate with Android SDK tools." > android-app/debug-signing-certificate.txt
          fi
          grep -E "Signer #1 certificate SHA-1 digest:|Signer #1 certificate SHA-256 digest:" android-app/debug-signing-certificate.txt | sed -E 's/.*SHA-1 digest: /SHA-1: /; s/.*SHA-256 digest: /SHA-256: /' > android-app/SHA1-FINGERPRINT.txt
          if ! grep -q "SHA-1:" android-app/SHA1-FINGERPRINT.txt; then
            echo "SHA-1 fingerprint was not found. See debug-signing-certificate.txt." >> android-app/SHA1-FINGERPRINT.txt
          fi

      - name: Upload installable APK and setup fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: netaji-club-android-debug
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/debug-signing-certificate.txt
            android-app/SHA1-FINGERPRINT.txt
          if-no-files-found: error
          retention-days: 30
