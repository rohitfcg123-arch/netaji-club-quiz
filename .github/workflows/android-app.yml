name: Build Netaji Club Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-app assembleDebug

      - name: Write APK signing fingerprint
        shell: bash
        run: |
          set -uo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          OUT="android-app/debug-signing-certificate.txt"
          SIMPLE="android-app/SHA1-FINGERPRINT.txt"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK" | tee "$OUT" "$SIMPLE"
            exit 1
          fi
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > "$OUT" 2>&1 || true
          else
            keytool -printcert -jarfile "$APK" > "$OUT" 2>&1 || true
          fi
          SHA1="$(grep -i 'SHA-1' "$OUT" | head -n 1 | sed -E 's/.*SHA-1[^:]*:[[:space:]]*//I' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          if [ -z "$SHA1" ]; then
            SHA1="$(grep -i 'SHA1' "$OUT" | head -n 1 | sed -E 's/.*SHA1[^:]*:[[:space:]]*//I' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          fi
          if [ -n "$SHA1" ]; then
            printf 'SHA-1: %s\n' "$SHA1" > "$SIMPLE"
          else
            printf 'Could not automatically parse SHA-1. Full certificate output is in debug-signing-certificate.txt.\n' > "$SIMPLE"
          fi
          cat "$SIMPLE"
      - name: Upload installable APK and setup fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: netaji-club-android-debug
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/debug-signing-certificate.txt
            android-app/SHA1-FINGERPRINT.txt
          if-no-files-found: error
          retention-days: 30
